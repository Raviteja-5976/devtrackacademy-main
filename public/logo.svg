<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Neo-Brutalist shadow -->
  <rect x="12" y="12" width="76" height="76" rx="16" fill="#1B1F3B" />
  <!-- Main white square with dark border -->
  <rect x="8" y="8" width="76" height="76" rx="16" fill="#FFFFFF" stroke="#1B1F3B" stroke-width="6" />
  <!-- Stylized developer chevron prompt -->
  <path d="M 28 32 L 48 48 L 28 64" stroke="#FF6B35" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Track/underline pathway line -->
  <line x1="48" y1="64" x2="72" y2="64" stroke="#1B1F3B" stroke-width="8" stroke-linecap="round" />
  <!-- Rotating accent cursor block -->
  <rect x="58" y="28" width="12" height="18" fill="#6EE7B7" stroke="#1B1F3B" stroke-width="3" rx="2" transform="rotate(15 64 37)" />
</svg>
